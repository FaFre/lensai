name: weblibre_project

environment:
  sdk: '>=3.8.0 <4.0.0'
workspace:
  - apps/weblibre/
  - packages/flutter_mozilla_components
  - packages/flutter_mozilla_components/example
  - packages/flutter_tor
  - packages/flutter_tor/example
  - packages/simple_intent_receiver
  - packages/simple_intent_receiver/example
  - packages/locale_resolver
  - packages/locale_resolver/example
  - packages/speech_to_text_dialog
  - packages/speech_to_text_dialog/example
  - packages/flutter_singbox_proxy
  - packages/flutter_singbox_proxy/example
dev_dependencies:
  melos: ^7.8.1

melos:
  name: weblibre_project

  command:
    bootstrap:
      enforceLockfile: true
    clean:
      hooks:
        pre: melos exec -c 1 -- "flutter clean"

  scripts:
    upgrade-major-tighten:
      run: |
        dart pub upgrade --major-versions --tighten
      exec:
        concurrency: 1
    validate-dependencies:
      description: Validates dependcies in the workspace
      packageFilters:
        noDependsOn: melos
      exec: |
        dart pub global run dependency_validator
    build-watch:
      description: Generate and watch files with build_runner in the workspace
      packageFilters:
        dependsOn: build_runner
      exec: |
        dart run build_runner watch --delete-conflicting-outputs
    build:
      description: Generate files with build_runner in the workspace
      packageFilters:
        dependsOn: build_runner
      run: |
        dart run build_runner build --delete-conflicting-outputs
      exec:
        failFast: true
        concurrency: 1
    build-pigeons:
      description: Running pigeon for files in pigeons directory
      exec: |
        echo "Running pigeon for files in pigeons directory:"
        for file in ./pigeons/*; do
          if [ -f "\$file" ]; then
            echo "Processing \$file"
            flutter pub run pigeon --input "\$file"
          fi
        done
      packageFilters:
        dirExists: 'pigeons'
    format:
      description: Format all Dart files in the workspace
      exec: dart format .
    update-assets:
      description: Download external assets (bangs, bridges, URL lists)
      run: bash scripts/update-assets.sh
    build-components:
      description: Build JS components and generate quotes/sites DBs
      run: |
        set -e
        sh scripts/build-container-proxy.sh
        sh scripts/build-readability.sh
        python3 scripts/build_quotes_db.py
        python3 scripts/build_sites_db.py
    build-singbox-libbox:
      description: Build official sing-box Android libbox AAR for flutter_singbox_proxy
      run: packages/flutter_singbox_proxy/scripts/build-libbox-android.sh
    build-go-runtime:
      description: Build combined Android gomobile runtime AAR for proxy plugins
      run: native/go_mobile_runtime/scripts/build-android.sh
    test-android:
      description: Run the host-side Kotlin unit tests for the native plugins
      run: |
        set -e
        # No flutter/melos equivalent exists for Android unit tests, so this is
        # the one sanctioned gradle invocation. It needs a configured Android
        # project, which `flutter build`/`flutter run` produces — run one first
        # on a clean checkout.
        cd apps/weblibre/android
        # --continue: one applinks test fails permanently (see CLAUDE.md), and
        # without it that failure would stop the modules after it from running
        # at all. Read the XML reports, not the exit status.
        ./gradlew --continue \
          :flutter_mozilla_components:testDebugUnitTest \
          :flutter_singbox_proxy:testDebugUnitTest \
          :simple_intent_receiver:testDebugUnitTest

    build-browser:
      description: Build stable release APKs split per ABI with the Skia renderer
      run: |
        set -e
        cd apps/weblibre
        flutter build apk --release --flavor stable --target-platform android-arm,android-arm64,android-x64 --split-per-abi --no-tree-shake-icons
    build-browser-impeller:
      description: Build stable comparison APKs split per ABI with Impeller enabled
      run: |
        set -e
        cd apps/weblibre
        flutter build apk --release --flavor stableImpeller --target-platform android-arm,android-arm64,android-x64 --split-per-abi --no-tree-shake-icons
    build-browser-alpha:
      description: Build alpha release APKs split per ABI with the Skia renderer
      run: |
        set -e
        cd apps/weblibre
        flutter build apk --release --flavor alpha --target-platform android-arm,android-arm64,android-x64 --split-per-abi --no-tree-shake-icons
    build-browser-alpha-impeller:
      description: Build alpha comparison APKs split per ABI with Impeller enabled
      run: |
        set -e
        cd apps/weblibre
        flutter build apk --release --flavor alphaImpeller --target-platform android-arm,android-arm64,android-x64 --split-per-abi --no-tree-shake-icons
