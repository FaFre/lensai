name: weblibre
description: "The Privacy-Focused & AI-Powered Research Browser"
publish_to: 'none'
resolution: workspace
version: 0.30.0-alpha-10+40

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  background_fetch: ^1.7.0
  collection: ^1.19.1
  convert: ^3.1.2
  copy_with_extension: ^17.0.0
  country_codes: ^3.3.0
  country_flags: ^4.1.2
  crypto: ^3.0.7
  cryptography_flutter: ^2.3.4
  device_info_plus: ^13.2.0
  drift: ^2.34.3
  drift_dev: ^2.34.5
  dynamic_color: ^1.9.0
  exceptions: ^0.6.1
  fading_scroll: ^0.9.4
  fancy_password_field: ^3.0.0
  fast_equatable: ^1.3.1
  file_picker: ^12.1.1
  flutter:
    sdk: flutter
  flutter_auto_size_text: ^5.0.0
  flutter_displaymode: ^0.7.0
  flutter_hooks: ^0.21.3+1
  flutter_markdown: ^0.7.7+1
  flutter_material_design_icons: ^3.1.0+7447
  flutter_mozilla_components:
    path: ../../packages/flutter_mozilla_components
  flutter_reorderable_grid_view: ^5.7.0
  flutter_secure_storage: ^11.0.0
  flutter_singbox_proxy:
    path: ../../packages/flutter_singbox_proxy
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.3.0
  flutter_tor:
    path: ../../packages/flutter_tor
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  graphview: ^1.5.1
  home_widget: ^0.9.3
  hooks_riverpod: ^3.4.2
  html: ^0.15.6
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  lexo_rank:
    git:
      url: https://github.com/FaFre/lexo_rank.git
  local_auth: ^3.0.2
  locale_resolver:
    path: ../../packages/locale_resolver
  logger: ^2.7.0
  markdown: ^7.3.1
  material_color_utilities: ^0.13.0
  mime: ^2.0.0
  nullability: ^1.0.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  pretty_qr_code: ^3.6.0
  privacypass_client:
    git:
      url: https://gitlab.com/weblibre/search_client.git
      ref: a0e4afe03a24b5f0f7ecd3b24317072e8ee00bbd
      path: packages/privacypass_client
  qr_code_scanner_plus: ^2.2.0
  quick_actions: ^1.1.0
  riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  rss_dart: ^1.0.14
  rxdart: ^0.28.0
  saf_stream: ^4.0.1
  saf_util: ^3.1.0
  search_client:
    git:
      url: https://gitlab.com/weblibre/search_client.git
      ref: a0e4afe03a24b5f0f7ecd3b24317072e8ee00bbd
      path: packages/search_client
  search_protocol:
    git:
      url: https://gitlab.com/weblibre/search_client.git
      ref: a0e4afe03a24b5f0f7ecd3b24317072e8ee00bbd
      path: packages/search_protocol
  secure_archive:
    git:
      url: https://github.com/FaFre/secure_archive.git
      path: packages/secure_archive
      ref: 9bec69d2b9957a629f4a7c4d4a732aaa24c3b40b
  share_plus: ^13.3.0
  simple_intent_receiver:
    path: ../../packages/simple_intent_receiver
  skeletonizer: ^2.1.3
  sliver_tools: ^0.2.12
  smooth_page_indicator: ^3.0.0
  socks5_proxy: ^2.1.1
  speech_to_text_dialog:
    path: ../../packages/speech_to_text_dialog
  sqlite3: ^3.5.2
  supabase: ^2.16.1
  synchronized: ^3.4.1+2
  text_scroll: ^0.2.1
  timeago: ^3.7.1
  uri_to_file:
    git:
      url: https://github.com/FaFre/uri-to-file.git
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  xxh3: ^1.2.0

dev_dependencies:
  build_runner: ^2.16.0
  copy_with_extension_gen: ^17.0.0
  flutter_launcher_icons: ^0.14.4
  # Same trick as path_provider below: lets the secure-storage tests swap in an
  # in-memory backend so profile key scoping can be exercised without a device.
  flutter_secure_storage_platform_interface: ^2.0.3
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0
  json_serializable: ^6.14.1
  lint: ^2.8.0
  mockito: ^5.8.1
  # Lets the startup gate tests point path_provider at a temp tree so
  # `filesystem` can be exercised without a device.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
  assets:
    - assets/bangs/
    - assets/fonts/
    - assets/icon/
    - assets/images/
    - assets/landing/
    - assets/preferences/
    - assets/legal/
    - assets/quotes/
    - assets/sites/
    - assets/small_web/
    - assets/ublock/
  fonts:
    - family: TorIcons
      fonts:
        - asset: assets/fonts/tor-icons.ttf
    - family: WebLibre
      fonts:
        - asset: assets/fonts/WebLibre.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_monochrome: "assets/icon/icon.png"
  adaptive_icon_foreground_inset: 25
  adaptive_icon_background: "#FF000000"
